<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades - Mantenimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/unidades.css">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="d-flex align-items-center justify-content-between flex-wrap">
            <h1 class="mt-3">Unidades</h1>
            <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" class="mt-2">
        </div>
        <div class="row d-flex">
            <div class="col-lg-12">

                <!-- Acordeón que contiene el formulario -->
                <div class="accordion mt-4" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFormulario" aria-expanded="false" aria-controls="collapseFormulario">
                                Agregar nueva unidad
                            </button>
                        </h2>
                        <div id="collapseFormulario" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <form class="container">
                                    <div class="row mb-3">
                                        <div class="unidad col-sm-2 col-4">
                                            <label for="id_u" class="m-1">ID</label>
                                            <input type="text" id="id_u" class="form-control" placeholder="ID">
                                            <p class="error invalid-feedback" id="error-id" style="color: red;"></p>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="unidad col-md-5">
                                            <label for="nombre_u" class="m-1">Nombre</label>
                                            <input type="text" id="nombre_u" class="form-control" placeholder="Nombre">
                                            <p class="error invalid-feedback" id="error-nombre" style="color: red;"></p>
                                        </div>
                                        <div class="unidad col-md-5">
                                            <label for="modelo" class="m-1">Modelo</label>
                                            <input type="text" id="modelo" class="form-control" placeholder="Modelo">        
                                            <p class="error invalid-feedback" id="error-modelo" style="color: red;"></p>
                                        </div>
                                        <div class="unidad col-md-2">
                                            <label for="año" class="m-1">Año</label>
                                            <input type="text" id="año" class="form-control" placeholder="Año">
                                            <p class="error invalid-feedback" id="error-año" style="color: red;"></p>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="unidad col-md-4">
                                            <label for="departamento" class="m-1">Departamento:</label>
                                            <select id="departamento" class="form-select" aria-label="Default select example">
                                                <option value="0">Seleccione...</option>

                                            </select>
                                            <p class="error invalid-feedback" id="error-departamento" style="color: red;"></p>
                                        </div>
                                        <div class="unidad col-md-4">
                                            <label for="empleado" class="m-1">Empleado:</label>
                                            <select id="empleado" class="form-select" aria-label="Default select example">
                                                <option value="0">Seleccione...</option>

                                            </select>
                                            <p class="error invalid-feedback" id="error-empleado" style="color: red;"></p>
                                        </div>
                                        <div class="unidad col-md-4">
                                            <label for="descripcion" class="m-1">Descripción</label>
                                            <input type="text" id="descripcion" class="form-control no-arrows" placeholder="Descripción">
                                            <p class="error invalid-feedback" id="error-descripcion" style="color: red;"></p>
                                        </div> 
                                    </div>   
                                    <div class="d-flex justify-content-end mt-4">
                                        <button id="btn_add" type="button" class="btn btn-primary">Agregar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filtros de búsqueda -->
                <div id="filtrosS" class="row d-flex mt-3">
                    <div class="col-md">
                        <label for="filtro_tipo" class="form-label filtro m-1">Filtrar por</label>
                        <select class="form-select" id="filtro_tipo">
                            <option value="0">Todos</option>
                            <option value="id_unidad">ID</option>
                            <option value="nombre">Nombre</option>
                            <option value="modelo">Modelo</option>
                            <option value="año">Año</option>
                            <option value="departamento">Departamento</option>
                            <option value="empleado">Empleado</option>
                        </select>
                    </div>
                    <div class="col-md">
                        <label for="filtro_orden" class="form-label filtro m-1">Mostrar</label>
                        <select class="form-select" id="filtro_orden" disabled>

                        </select>
                    </div>
                    <div class="col-md">
                        <label for="filtro_buscar" class="form-label filtro m-1">Buscar</label>
                        <input type="text" id="filtro_buscar" class="form-control" placeholder="Buscar registro...">
                    </div>
                    <div class="col-md d-flex align-items-end justify-content-end mt-3">
                        <button id="btn_filtro" class="btn btn-primary">Filtrar</button>
                    </div>
                </div>

                <!-- Tabla de registros -->
                <div class="table-responsive mt-5">
                    <table id="tabla_unidades" class="table table-bordered table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Modelo</th>
                                <th>Año</th>
                                <th>Departamento</th>
                                <th>Empleado</th>
                                <th>Descripción</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Aquí se agregan los registros -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <!-- Modal para editar unidad -->
    <div class="modal fade" id="unidad_modal" tabindex="-1" aria-labelledby="unidad_modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="unidad_modalLabel">Editar unidad</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="form-editar-unidad">
                            <input type="hidden" id="edit_id_unidad">
                            
                            <!-- Campos no editables -->
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="edit_id_display" class="form-label">ID</label>
                                    <input type="text" class="form-control" id="edit_id_display" disabled>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="edit_departamento" class="form-label">Departamento</label>
                                    <input type="text" class="form-control" id="edit_departamento" disabled>
                                </div>
                                <div class="col-md-6">
                                    <label for="edit_empleado" class="form-label">Empleado</label>
                                    <input type="text" class="form-control" id="edit_empleado" disabled>
                                </div>
                            </div>
                            
                            <!-- Campos editables -->
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="edit_nombre" class="form-label">Nombre *</label>
                                    <input type="text" class="form-control" id="edit_nombre" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="edit_modelo" class="form-label">Modelo *</label>
                                    <input type="text" class="form-control" id="edit_modelo" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="edit_anio" class="form-label">Año *</label>
                                    <input type="text" class="form-control" id="edit_anio" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col">
                                    <label for="edit_descripcion" class="form-label">Descripción *</label>
                                    <textarea class="form-control" id="edit_descripcion" rows="4"></textarea>
                                </div>
                            </div>
                            
                        </form>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="form-text text-muted">* Campos editables</div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btn_guardar_cambios">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site_footer" class="mt-4">
        
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./js/nav.js" type="module"></script>
<script src="/js/verificacion.js" type="module"></script>
<script src="./js/unidades.js" type="module"></script>
</body>
</html>
