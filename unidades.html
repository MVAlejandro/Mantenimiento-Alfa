<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades - Mantenimiento</title>
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/unidades.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="row d-flex">
            <div class="col-lg-6">
                <div id="formulario" class="card mt-5 m-3">
                <div class="card-body">
                    <div class="container">
                        <div class="d-flex align-items-center justify-content-between flex-wrap">
                            <h1 class="card-title mt-3 mb-5">Unidad / Equipo</h1>
                            <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" class="mb-3">
                        </div>
                        <p><strong>Ingrese los datos de la unidad que desea agregar:</strong></p>
                        <!-- Formulario -->
                        <form>
                            <div class="unidad form-floating col-3 ms-auto mb-3">
                                <input type="text" id="id_u" class="form-control" placeholder="ID">
                                <label for="id_u">ID</label>
                                <p class="error invalid-feedback" id="error-id" style="color: red;"></p>
                            </div>
                            <div class="unidad form-floating mb-3">
                                <input type="text" id="nombre_u" class="form-control" placeholder="Nombre">
                                <label for="nombre_u">Nombre</label>
                                <p class="error invalid-feedback" id="error-nombre" style="color: red;"></p>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <div class="unidad form-floating">
                                        <input type="text" id="modelo" class="form-control" placeholder="Modelo">
                                        <label for="modelo">Modelo</label>
                                        <p class="error invalid-feedback" id="error-modelo" style="color: red;"></p>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="unidad form-floating">
                                        <input type="text" id="año" class="form-control" placeholder="Año">
                                        <label for="año">Año</label>
                                        <p class="error invalid-feedback" id="error-año" style="color: red;"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="unidad row mb-3">
                                    <div class="col-lg-2 d-flex align-items-center">
                                        <label for="encargado" class="form-label">Encargado:</label>
                                    </div>
                                    <div class="col-lg-9 ms-auto">
                                        <select id="encargado" class="form-select" aria-label="Default select example">
                                            <option value="0">Seleccione...</option>
                                            <option value="1">Juan Pérez</option>
                                            <option value="2">Ana Gómez</option>
                                        </select>
                                        <p class="error invalid-feedback" id="error-encargado" style="color: red;"></p>
                                    </div>
                            </div>
                            <div class="unidad form-floating mb-3">
                                <input type="text" id="descripcion" class="form-control no-arrows" placeholder="Descripción">
                                <label for="descripcion">Descripción</label>
                                <p class="error invalid-feedback" id="error-descripcion" style="color: red;"></p>
                            </div>
                            <div class="btn-wrapper d-flex justify-content-end align-items-end mt-4">
                                <button id="btn_add" type="button" class="btn">Agregar</button>
                            </div>
                        </form>
                    </div>
                </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="accordion mt-5 mb-5" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                            Mostrar registros
                        </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div id="desglose" class="accordion-body">
                            
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site_footer" class="mt-4">
        
    </footer>

<script src="./js/nav.js"></script>
<script src="./js/unidades.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
