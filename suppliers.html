<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proveedores - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="suppliers-header">
            <div id="suppliers-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col-8 col-md-9 col-lg-10 d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person-gear" viewBox="0 0 16 16">
                                <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m.256 7a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1zm3.63-4.54c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.045c-.613-.18-.613-1.048 0-1.229l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382zM14 12.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Responsables del Mantenimiento</h4>
                    </div>
                    <div class="col-4 col-md-3 col-lg-2 d-flex align-items-center">
                        <button id="btn-add-supplier" class="btn btn-primary d-flex align-items-center" data-bs-target="#edit-modal" data-bs-toggle="modal"  data-mant-only>
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-1">Añadir Externo</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FILTROS GENERALES -->
        <section id="suppliers-filter pt-3">
            <div id="suppliers-filter-container" class="container pt-4 pb-3">
                <div class="row ms-2 me-2">
                    <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border">
                        <label for="search-filter" class="form-label m-2">Buscar</label>    
                        <input id="search-filter" class="form-control" type="search" placeholder="Buscar por Nombre o Empresa" aria-label="Search"/>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REPORTE GENERAL -->
        <section id="suppliers" class="pt-1 pb-4">
            <div id="suppliers-container" class="container table-responsive p-0">
                <table id="suppliers-table" class="table table-hover align-middle">
                    <thead>
                        <tr class="table-light">
                            <th class="p-1 pt-2 ps-4">TIPO</th>
                            <th class="p-1 pt-2">NOMBRE</th>
                            <th class="p-1 pt-2">DETALLES</th>
                            <th class="p-1 pt-2">ESTADO</th>
                            <th data-mant-only></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="text-center" colspan="5">No hay responsables asignados</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SECCIÓN DE PAGINACIÓN -->
        <section id="suppliers-pages" class="pb-4">
            <div id="suppliers-pages-container" class="container pt-3 pb-3">
                <div class="row ms-2 align-items-center">
                    <div class="col-6 col-lg-9">
                        <p id="suppliers-pages-results"></p>
                    </div>
                    <div class="col-6 col-lg-3">
                        <nav aria-label="Page navigation example">
                            <ul class="pagination mb-0">
                                <!-- Los botones se llenan dinámicamente desde JS -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Editar Proveedor Externo</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="suppliers-edit-form">
                            <input type="hidden" id="edit-id-supplier">
                            <!-- Campos editables -->
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-name" class="form-label m-2">Nombre</label>
                                    <input type="text" class="form-control" id="edit-name" autocomplete="off">
                                    <p class="error invalid-feedback" id="error-editName" style="color: red;"></p>
                                </div>
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-company" class="form-label m-2">Empresa</label>
                                    <input type="text" class="form-control" id="edit-company" autocomplete="off">
                                    <p class="error invalid-feedback" id="error-editCompany" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-phone" class="form-label m-2">Teléfono</label>
                                    <input type="text" class="form-control" id="edit-phone" autocomplete="off">
                                    <p class="error invalid-feedback" id="error-editPhone" style="color: red;"></p>
                                </div>
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-email" class="form-label m-2">Correo</label>
                                    <input type="text" class="form-control" id="edit-email" autocomplete="off">
                                    <p class="error invalid-feedback" id="error-editEmail" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col label-over-border">
                                    <label for="edit-address" class="form-label m-2">Dirección</label>
                                    <input type="text" class="form-control" id="edit-address" autocomplete="off">
                                    <p class="error invalid-feedback" id="error-editAddress" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button id="btn-edit-entry" class="btn btn-primary">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar registro -->
    <div class="modal fade" id="delete-modal" aria-hidden="true" aria-labelledby="delete-modalLabel" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content pt-3 pb-2">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-circle" viewBox="0 0 16 16" style="color: var(--danger-dark)">
                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                    <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="delete-modalLabel">Confirmar eliminación</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body m-auto pt-4 pb-4">
                    <input type="hidden" id="delete-id-product">
                    <p>¿Está seguro de querer eliminar el registro seleccionado?</p>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button id="btn-delete-entry" class="btn btn-primary">Sí</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/js/pages/suppliers.js"></script>
</body>
</html>
