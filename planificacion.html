<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificación de tareas - Mantenimiento</title>
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/planificacion.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>

    <!-- CONTENIDO PRINCIPAL -->
     <main id="main" class="container col-10 mt-5 m-auto">
        <div class="tabs">
            <div class="tab active" data-view="calendar-view">Vista Calendario</div>
            <div class="tab" data-view="gantt-view">Vista Gantt</div>
        </div>
        
        <div class="content">
            <!-- Vista Gantt -->
            <div id="gantt-view" class="view">
                <div class="controls">
                    <button type="button" class="btn btn-primary" onclick="changeViewMode('Day')">Vista Día</button>
                    <button type="button" class="btn btn-primary" onclick="changeViewMode('Week')">Vista Semana</button>
                    <button type="button" class="btn btn-primary" onclick="changeViewMode('Month')">Vista Mes</button>
                </div>
                <div id="gantt-container"></div>
            </div>
            
            <!-- Vista Calendario -->
            <div id="calendar-view" class="view active">
                <div id="calendar"></div>
            </div>
        </div>
     </main>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Detalles de la tarea</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div id="evento_modal" class="modal-body">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>

<script src="./js/nav.js"></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.min.js'></script>
<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
<script src="./js/planificacion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
