<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refacciones - Mantenimiento</title>
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/refacciones.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="row d-flex">
            <div class="col-md-8 col-lg-6">
                <div class="card mt-5 m-3">
                <div class="card-body">
                    <div class="container">
                        <div class="d-flex align-items-center justify-content-between flex-wrap">
                            <h1 class="card-title mt-3 mb-5">Refacciones</h1>
                            <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" class="mb-3">
                        </div>
                        <p><strong>Ingrese los datos de la refaccion que desea agregar:</strong></p>
                        <!-- Formulario -->
                        <form class="text-end">
                            <div class="unidad form-floating mb-3">
                                <input type="text" id="nombre_u" class="form-control" placeholder="Nombre">
                                <label for="nombre_u">Nombre</label>
                                <p class="error invalid-feedback" id="error-nombre" style="color: red;"></p>
                            </div>
                            <div class="unidad form-floating mb-3">
                                <input type="number" id="costo" class="form-control no-arrows" placeholder="Modelo">
                                <label for="costo">Costo</label>
                                <p class="error invalid-feedback" id="error-costo" style="color: red;"></p>
                            </div>
                            <div class="unidad form-floating mb-3">
                                <input type="text" id="unidad_med" class="form-control" placeholder="Año">
                                <label for="unidad_med">Unidad de medida</label>
                                <p class="error invalid-feedback" id="error-unidad_med" style="color: red;"></p>
                            </div>
                        </form>
                    </div>
                </div>
                </div>
            </div>

            <div class="col-md-4 col-lg-6">
                <div class="accordion mt-5 mb-5" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                            Mostrar registros
                        </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            <strong>Detalles...
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>

<script src="./js/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
