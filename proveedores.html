<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Mantenimiento</title>
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/proveedores.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        <br>
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="row d-flex">
            <div class="col-md-8 col-lg-6">
                <div class="card mt-5 m-3">
                <div class="card-body">
                    <div class="container">
                        <div class="d-flex align-items-center justify-content-between flex-wrap">
                            <h1 class="card-title mt-3 mb-5">Proveedores</h1>
                            <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" class="mb-3">
                        </div>
                        <p><strong>Ingrese los datos del usuario que desea agregar:</strong></p>
                        <!-- Formulario -->
                        <form>
                            <div class="proveedor form-floating col-3 ms-auto mb-3">
                                <input type="text" id="id_p" class="form-control" placeholder="ID">
                                <label for="id_p">ID</label>
                                <p class="error invalid-feedback" id="error-id" style="color: red;"></p>
                            </div>
                            <div class="proveedor form-floating mb-3">
                                <input type="text" id="nombre_p" class="form-control" placeholder="Nombre">
                                <label for="nombre_p">Nombre</label>
                                <p class="error invalid-feedback" id="error-nombre" style="color: red;"></p>
                            </div>
                            <div class="proveedor form-floating mb-3">
                                <input type="text" id="empresa" class="form-control" placeholder="Empresa">
                                <label for="empresa">Empresa</label>
                                <p class="error invalid-feedback" id="error-empresa" style="color: red;"></p>
                            </div>
                            <div class="proveedor form-floating mb-3">
                                <input type="text" id="dirección" class="form-control" placeholder="Dirección">
                                <label for="dirección">Dirección</label>
                                <p class="error invalid-feedback" id="error-dirección" style="color: red;"></p>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="proveedor form-floating mb-3">
                                        <input type="number" id="telefono" class="form-control no-arrows" placeholder="Teléfono">
                                        <label for="telefono">Teléfono</label>
                                        <p class="error invalid-feedback" id="error-telefono" style="color: red;"></p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="proveedor form-floating mb-3">
                                        <input type="email" id="email" class="form-control" placeholder="Email">
                                        <label for="email">Email</label>
                                        <p class="error invalid-feedback" id="error-email" style="color: red;"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="proveedor form-floating mb-3">
                                <input type="text" id="descripción" class="form-control" placeholder="Descripción">
                                <label for="descripción">Descripción</label>
                                <p class="error invalid-feedback" id="error-descripción" style="color: red;"></p>
                            </div>
                            <div class="btn-wrapper d-flex justify-content-end align-items-end mt-4">
                                <button id="btn_add" type="button" class="btn">Agregar</button>
                            </div>
                        </form>
                    </div>
                </div>
                </div>
            </div>

            <div class="col-md-4 col-lg-6">
                <div class="accordion mt-5 mb-5" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                            Mostrar registros
                        </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            <strong>Detalles...
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site_footer">
        
    </footer>

<script src="./js/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
