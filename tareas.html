<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas - Mantenimiento</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/tareas.css">
    <link rel="icon" href="./assets/Logo-Color-PNG-62x51.png">
</head>
<body>
    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top_bar">
        
    </div>

    <!-- BARRA DE NAVEGACION PRINCIPAL -->
    <header id="site_header">
        
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main" class="container">
        <div class="row d-flex">
            <div class="col-lg-6">
                <div id="formulario" class="card mt-5 m-3">
                <div class="card-body">
                    <div class="container">
                        <div class="d-flex align-items-center justify-content-between flex-wrap">
                            <h1 class="card-title mt-3 mb-5">Tareas</h1>
                            <img src="./assets/Logo-Color-PNG-62x51.png" alt="Logo" class="mb-3">
                        </div>
                        <p><strong>Ingrese los datos de la tarea que desea agregar:</strong></p>
                        <!-- Formulario -->
                        <form>
                            <div class="tarea form-floating mb-3">
                                <input type="text" id="nombre_t" class="form-control" placeholder="Nombre">
                                <label for="nombre_t">Nombre</label>
                                <p class="error invalid-feedback" id="error-nombre" style="color: red;"></p>
                            </div>

                            <div class="tarea row mb-3">
                                <div class="col-lg-2 d-flex align-items-center">
                                    <label for="unidad" class="form-label" style="padding: 16px;">Unidad:</label>
                                </div>
                                <div class="col-lg-9 ms-auto">
                                    <select id="unidad" class="form-select" aria-label="Default select example" style="padding: 16px;">
                                        <option value="0">Seleccione...</option>
                                        
                                    </select>
                                    <p class="error invalid-feedback" id="error-unidad" style="color: red;"></p>
                                </div>
                            </div>

                            <div class="tarea row mb-3">
                                <div class="col-lg-2 d-flex align-items-center">
                                    <label for="sistema" class="form-label" style="padding: 16px;">Sistema:</label>
                                </div>
                                <div class="col-lg-9 ms-auto">
                                    <select id="sistema" class="form-select" aria-label="Default select example" style="padding: 16px;">
                                        <option value="0">Seleccione...</option>
                                        
                                    </select>
                                    <p class="error invalid-feedback" id="error-sistema" style="color: red;"></p>
                                </div>
                            </div>

                            <div class="tarea row mb-3">
                                <div class="col-lg-2 d-flex align-items-center">
                                    <label for="periodicidad" class="form-label" style="padding: 16px;">Periodicidad:</label>
                                </div>
                                <div class="col-lg-9 ms-auto">
                                    <select id="periodicidad" class="form-select" aria-label="Default select example" style="padding: 16px;">
                                        <option value="0">Seleccione...</option>

                                    </select>
                                    <p class="error invalid-feedback" id="error-periodicidad" style="color: red;"></p>
                                </div>
                            </div>

                            <div class="tarea form-floating mb-3">
                                <input type="text" id="descripcion" class="form-control no-arrows" placeholder="Descripción">
                                <label for="descripcion">Descripción</label>
                                <p class="error invalid-feedback" id="error-descripcion" style="color: red;"></p>
                            </div>

                            <div class="btn-wrapper d-flex justify-content-end align-items-end mt-4">
                                <button id="btn_add" type="button" class="btn">Agregar</button>
                            </div>
                        </form>
                    </div>
                </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="accordion mt-5 mb-5" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                            Mostrar registros
                        </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div id="desglose" class="accordion-body">
                            
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="asignacion_modal" tabindex="-1" aria-labelledby="asignacion_modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="asignacion_modalLabel">Asignación de tarea</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="tarea row mb-3">
                        <div class="col-lg-2 d-flex align-items-center">
                            <label for="responsable" class="form-label">Responsable:</label>
                        </div>
                        <div class="col-lg-9 ms-auto">
                            <select id="responsable" class="form-select" aria-label="Default select example">
                                <option value="0">Seleccione...</option>
                                            
                            </select>
                            <p class="error invalid-feedback" id="error-responsable" style="color: red;"></p>
                        </div>
                    </div>
                    
                    <div class="tarea row mb-3">
                        <div class="col-lg-5 d-flex align-items-center">
                            <label for="fecha_programada" class="form-label">Fecha programada</label>
                        </div>
                        <div class="col-lg-7">
                            <input type="date" id="fecha_programada" class="form-control" placeholder="Fecha">
                            <p class="error invalid-feedback" id="error-fecha" style="color: red;"></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" data-bs-dismiss="modal">Cerrar</button>
                    <button  id="btn_asignar" type="button" class="btn">Asignar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site_footer" class="mt-4">
        
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./js/nav.js" type="module"></script>
<script src="/js/verificacion.js" type="module"></script>
<script src="./js/tareas.js" type="module"></script>
</body>
</html>
